# รันบนเซิร์ฟเวอร์ (ต้องมี ../.env ที่มีรหัสผ่านครูและ Admin ไม่อยู่ใน git)
#   ลิงก์ชั่วคราวแบบไม่ต้องมีโดเมน: docker compose -f deploy/docker-compose.yml --profile quick up -d --build
#                                    แล้วดูลิงก์ด้วย ./deploy/link.sh (ลิงก์ *.trycloudflare.com เปลี่ยนเมื่อ tunnel เริ่มใหม่)
#   ลิงก์ถาวรบนโดเมนของเราใน Cloudflare: ./deploy/tunnel.sh <ชื่อโดเมน> (ใช้ profile named และ cloudflared/ ที่สคริปต์สร้าง)
name: ai-tutor
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - ../runtime:/app/runtime
    ports:
      - "127.0.0.1:8010:8000"  # ดูจากในเครื่องเซิร์ฟเวอร์ได้ (8000 มีโปรแกรมอื่นใช้)
  quick:
    image: cloudflare/cloudflared:2024.12.2
    profiles: ["quick"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://app:8000
    depends_on:
      - app
  tunnel:
    image: cloudflare/cloudflared:2024.12.2
    profiles: ["named"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - app
