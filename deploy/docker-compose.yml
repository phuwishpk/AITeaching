# รันบนเซิร์ฟเวอร์ด้วย ./deploy/up.sh (ต้องมี ../.env ที่มีรหัสผ่านครูและ Admin ไม่อยู่ใน git)
# หนึ่งโฟลเดอร์ = หนึ่งบัญชี: ข้อมูล API key และลิงก์แยกกัน รันหลายบัญชีได้ด้วยการ clone หลายโฟลเดอร์
# แล้วตั้ง TUTOR_PORT ใน .env ของแต่ละโฟลเดอร์ไม่ให้ซ้ำกัน
#   ลิงก์ชั่วคราวแบบไม่ต้องมีโดเมน: docker compose -f deploy/docker-compose.yml --profile quick up -d --build
#                                    แล้วดูลิงก์ด้วย ./deploy/link.sh (ลิงก์ *.trycloudflare.com เปลี่ยนเมื่อ tunnel เริ่มใหม่)
#   ลิงก์ถาวรบนโดเมนของเราใน Cloudflare: ./deploy/tunnel.sh <ชื่อโดเมน> (ใช้ profile named และ cloudflared/ ที่สคริปต์สร้าง)
name: ai-tutor
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - ../runtime:/app/runtime
    ports:
      - "127.0.0.1:${TUTOR_PORT:-8010}:8000"  # ดูจากในเครื่องเซิร์ฟเวอร์ได้ (8000 มีโปรแกรมอื่นใช้)
    mem_limit: 700m  # หลายบัญชีอยู่เครื่องเดียวกับบริการอื่น ไม่ให้ชุดใดกิน RAM จนเครื่องล่ม
  quick:
    image: cloudflare/cloudflared:2024.12.2
    profiles: ["quick"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://app:8000
    depends_on:
      - app
  tunnel:
    image: cloudflare/cloudflared:2024.12.2
    profiles: ["named"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - app
