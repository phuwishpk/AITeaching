# รันบนเซิร์ฟเวอร์: docker compose -f deploy/docker-compose.yml up -d --build
# ต้องมีบนเซิร์ฟเวอร์ (ไม่อยู่ใน git): ../.env (รหัสผ่านครูและ Admin) และ cloudflared/ (config และ credentials ของ tunnel)
name: ai-tutor
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - ../runtime:/app/runtime
    ports:
      - "127.0.0.1:8000:8000"
  tunnel:
    image: cloudflare/cloudflared:2024.12.2
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - app
